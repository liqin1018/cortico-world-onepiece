name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 包里没有运行时依赖，不需要 npm install / npm ci（也就没有 lockfile 要维护）
      - name: 跑八个测试套件
        run: npm test
